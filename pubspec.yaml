name: viper_flutter
description: "Viper for Flutter apps: report what's wrong on a staging build, with what was on screen, the logs and the device."
version: 0.1.0
homepage: https://github.com/twinsunllc/viper_flutter
repository: https://github.com/twinsunllc/viper_flutter
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.44.0'

# Each one checked against the pilot app's lockfile (Set&Co), so adding Viper changes none of its
# versions; webview_flutter is new to it and pinned to the version the spike ran.
dependencies:
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  logging: ^1.3.0
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.twinsun.viper.viper_flutter
        pluginClass: ViperFlutterPlugin
      ios:
        pluginClass: ViperFlutterPlugin
